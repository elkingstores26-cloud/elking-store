<script>
(function () {
  const id = parseInt(new URLSearchParams(location.search).get('id') || '0', 10);
  const p = window.ELKING_PRODUCTS.find(x => x.id === id) || window.ELKING_PRODUCTS[0];
  const catLabel = { new:'جديد', used:'مستعمل', acc:'إكسسوارات' }[p.cat];
  const catHref = { new:'new.html', used:'used.html', acc:'accessories.html' }[p.cat];

  // Build the gallery image list — falls back to single img for legacy products.
  // Held in a `let` so color variants can swap the gallery in place via rebuildGallery().
  let currentImgs = (Array.isArray(p.imgs) && p.imgs.length) ? p.imgs : (p.img ? [p.img] : []);

  document.title = `${p.name} — الكينج ستور`;
  document.getElementById('catBadge').textContent = catLabel;
  document.getElementById('brand').textContent = p.brand;
  document.getElementById('name').textContent = p.name;
  document.getElementById('nameCrumb').textContent = p.name;
  const cc = document.getElementById('catCrumb'); cc.href = catHref; cc.textContent = catLabel;
  document.getElementById('moreLink').href = catHref;

  // Stock status — render banner + disable order button when out of stock
  const outOfStock = p.inStock === false;
  if (outOfStock) {
    const banner = document.getElementById('stockBanner');
    banner.classList.remove('hidden');
    banner.innerHTML = `
      <div class="flex items-start gap-3 bg-red-50 border border-red-200 text-red-800 rounded-2xl p-4">
        <span class="w-9 h-9 rounded-full bg-red-100 flex items-center justify-center shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
        </span>
        <div>
          <div class="font-extrabold text-[15px] mb-0.5">المنتج ده غير متوفر حالياً</div>
          <div class="text-[13px] text-red-700/80 leading-relaxed">كلّمنا على واتساب وهنبلّغك أول ما يتوفر، أو نقترح عليك بديل مناسب.</div>
        </div>
      </div>`;
    // Disable the order button + repurpose CTA
    const actions = document.getElementById('actionsRow');
    if (actions) {
      actions.innerHTML = `
        <a href="https://wa.me/201017955559?text=${encodeURIComponent('السلام عليكم، عاوز أعرف لما يتوفر ' + p.name)}" class="flex-1 inline-flex items-center justify-center gap-2 bg-ink hover:bg-black text-gold font-extrabold px-6 py-4 rounded-full text-[16px] transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          بلّغني لما يتوفر
        </a>
        <a href="tel:01017955559" class="inline-flex items-center justify-center gap-2 border-2 border-ink hover:bg-ink hover:text-gold font-extrabold px-6 py-4 rounded-full text-[16px] transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h2.28a2 2 0 011.94 1.515l.7 2.79a2 2 0 01-.45 1.95l-1.27 1.27a14 14 0 006.28 6.28l1.27-1.27a2 2 0 011.95-.45l2.79.7A2 2 0 0121 16.72V19a2 2 0 01-2 2A16 16 0 013 5z"/></svg>
          اتصل
        </a>`;
    }
    // Add subtle desaturation on the gallery
    const hero = document.getElementById('hero');
    if (hero) hero.style.filter = 'grayscale(0.5) opacity(0.85)';
  }

  // Helpers must be defined BEFORE use — `const` doesn't hoist, so referencing them
  // earlier (e.g. inside the JSON-LD block) throws a TDZ ReferenceError that halts
  // the rest of the script and leaves price/description/gallery blank.
  const priceNum = v => parseFloat(String(v||'').replace(/[^\d.]/g,'')) || 0;
  const fmt = n => n.toLocaleString('en-US');

  // SEO: dynamic meta description + JSON-LD product schema
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.content = `${p.name} - ${p.storage || ''} - السعر ${p.price} ج.م. ${p.description ? p.description.slice(0, 120) : 'بضمان معتمد من الكينج ستور.'}`;
  const ogTitle = document.querySelector('meta[property="og:title"]');
  if (ogTitle) ogTitle.content = `${p.name} — الكينج ستور`;
  const ogImg = document.querySelector('meta[property="og:image"]');
  if (ogImg && p.img) ogImg.content = p.img;
  const ldScript = document.createElement('script');
  ldScript.type = 'application/ld+json';
  ldScript.textContent = JSON.stringify({
    "@context": "https://schema.org/",
    "@type": "Product",
    "name": p.name,
    "description": p.description || `${p.name} - ${p.storage || ''} - بضمان معتمد من الكينج ستور.`,
    "image": Array.isArray(p.imgs) && p.imgs.length ? p.imgs : [p.img].filter(Boolean),
    "brand": { "@type": "Brand", "name": p.brand },
    "sku": String(p.id),
    "category": catLabel,
    "offers": {
      "@type": "Offer",
      "url": location.href,
      "priceCurrency": "EGP",
      "price": String(priceNum(p.price)),
      "availability": p.inStock === false ? "https://schema.org/OutOfStock" : "https://schema.org/InStock",
      "seller": { "@type": "Store", "name": "الكينج ستور" }
    }
  });
  document.head.appendChild(ldScript);

  // If the main product has no price but variants do, fall back to the first variant
  // with a price — so the price block never shows just "ج.م" alone.
  function effectivePrice(view) {
    if (view.price && String(view.price).trim()) return view.price;
    if (Array.isArray(p.variants)) {
      const v = p.variants.find(v => v && v.price && String(v.price).trim());
      if (v) return v.price;
    }
    return '';
  }
  function effectiveOriginal(view) {
    if (view.originalPrice && String(view.originalPrice).trim()) return view.originalPrice;
    if (Array.isArray(p.variants)) {
      const v = p.variants.find(v => v && v.originalPrice && String(v.originalPrice).trim());
      if (v) return v.originalPrice;
    }
    return '';
  }

  // Apply a "view" — could be the product itself or a color variant — to the page.
  // Updates: hero/storage line, price block (with discount), images, and the WhatsApp deep-link.
  function applyView(view) {
    // Storage + color label with optional swatch
    const storageEl = document.getElementById('storage');
    storageEl.innerHTML = (view.colorHex ? `<span class="inline-block w-4 h-4 rounded-full border border-black/15" style="background:${view.colorHex}"></span>` : '')
      + `<span>${[view.storage || p.storage, view.color].filter(Boolean).join(' · ')}</span>`;

    // Price + optional discount block. If still no price anywhere, fall back to a
    // friendly "السعر بالاتصال" so we never show a lonely "ج.م" suffix.
    const shownPrice = effectivePrice(view);
    const shownOriginal = effectiveOriginal(view);
    const priceEl = document.getElementById('price');
    const currencyEl = priceEl.nextElementSibling;
    if (shownPrice) {
      priceEl.textContent = shownPrice;
      if (currencyEl) currencyEl.textContent = 'ج.م';
    } else {
      priceEl.textContent = 'السعر بالاتصال';
      priceEl.classList.remove('text-5xl');
      priceEl.classList.add('text-3xl');
      if (currencyEl) currencyEl.textContent = '';
    }
    const orig = priceNum(shownOriginal);
    const cur = priceNum(shownPrice);
    if (orig > cur && orig && cur) {
      const pct = Math.round(((orig - cur) / orig) * 100);
      document.getElementById('discountBadge').textContent = `خصم ${pct}٪`;
      document.getElementById('discountBadge').classList.remove('hidden');
      document.getElementById('originalPriceRow').classList.remove('hidden');
      document.getElementById('originalPrice').textContent = view.originalPrice;
      document.getElementById('price').classList.remove('text-ink');
      document.getElementById('price').classList.add('text-red-600');
      document.getElementById('savings').classList.remove('hidden');
      document.getElementById('savings').textContent = `وفّرت ${fmt(orig - cur)} ج.م`;
    } else {
      document.getElementById('discountBadge').classList.add('hidden');
      document.getElementById('originalPriceRow').classList.add('hidden');
      document.getElementById('savings').classList.add('hidden');
      document.getElementById('price').classList.remove('text-red-600');
      document.getElementById('price').classList.add('text-ink');
    }

    // WhatsApp text — include the price line only when we actually have one.
    const waText = 'السلام عليكم، عايز ' + p.name
      + (view.color ? ' (' + view.color + ')' : '')
      + (shownPrice ? ' — ' + shownPrice + ' ج.م' : '');
    document.getElementById('waBtn').href = 'https://wa.me/201017955559?text=' + encodeURIComponent(waText);

    // Swap gallery images if the variant carries its own
    if (Array.isArray(view.imgs) && view.imgs.length) {
      currentImgs = view.imgs;
      rebuildGallery();
    }
  }

  if (p.description && p.description.trim()) {
    document.getElementById('descBox').classList.remove('hidden');
    document.getElementById('description').textContent = p.description;
  }

  // Color variants: each variant carries its own price/images. Active variant is highlighted.
  // The default product images/price are shown as the "base" view (e.g. iPhone 15 in Pink),
  // which can be re-selected at any time via toggle-click on the active variant or via
  // the "إزالة الاختيار" reset link that appears when something is selected.
  const variants = Array.isArray(p.variants) ? p.variants.filter(v => v && (v.color || v.colorHex)) : [];
  let activeVariantIdx = -1;
  if (variants.length > 0) {
    document.getElementById('variantsBox').classList.remove('hidden');
    const list = document.getElementById('variantList');

    // Build (or reuse) the "إزالة الاختيار" reset row so we don't append duplicates on re-render.
    const variantsBox = document.getElementById('variantsBox');
    let resetRow = variantsBox.querySelector('[data-variant-reset]');
    if (!resetRow) {
      resetRow = document.createElement('div');
      resetRow.dataset.variantReset = '1';
      resetRow.className = 'mt-3 hidden';
      resetRow.innerHTML = `
        <button type="button" class="inline-flex items-center gap-1.5 text-[12px] font-bold text-black/55 hover:text-red-600 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          إزالة الاختيار — رجوع للصور الأساسية
        </button>`;
      variantsBox.appendChild(resetRow);
    }

    // Reset = go back to the base product (its original price/images/colors).
    function resetVariant() {
      activeVariantIdx = -1;
      applyView({
        color: p.color,
        colorHex: p.colorHex,
        price: p.price,
        originalPrice: p.originalPrice,
        storage: p.storage,
        imgs: (Array.isArray(p.imgs) && p.imgs.length) ? p.imgs : (p.img ? [p.img] : null),
      });
      renderVariants();
    }
    resetRow.querySelector('button').addEventListener('click', resetVariant);

    function renderVariants() {
      // Toggle the reset link's visibility based on whether a variant is selected.
      resetRow.classList.toggle('hidden', activeVariantIdx < 0);

      list.innerHTML = variants.map((v, i) => {
        const isActive = i === activeVariantIdx;
        const vPrice = v.price || p.price;
        // Prefer the variant's own first image as a thumbnail when present (Dubai Phone-style),
        // otherwise fall back to the colored circle so we still show a meaningful swatch.
        const thumb = (Array.isArray(v.imgs) && v.imgs.length)
          ? `<span class="w-12 h-12 rounded-lg border border-black/10 overflow-hidden shrink-0 bg-white"><img src="${v.imgs[0]}" class="w-full h-full object-cover" alt=""/></span>`
          : `<span class="w-10 h-10 rounded-full border border-black/15 shrink-0" style="background:${v.colorHex || '#ddd'}"></span>`;
        return `
          <button data-i="${i}" class="text-right p-2.5 rounded-xl border-2 transition flex items-center gap-2.5 ${isActive ? 'border-gold bg-gold/10' : 'border-black/10 hover:border-gold/50 bg-white'}" title="${isActive ? 'اضغط مرة تانية لإلغاء الاختيار' : ''}">
            ${thumb}
            <span class="flex-1 min-w-0">
              <span class="block text-[13px] font-bold truncate">${v.color || ''}</span>
              <span class="block text-[12px] text-gold-dark font-extrabold num-en">${vPrice ? vPrice + ' ج.م' : 'بنفس السعر'}</span>
            </span>
            ${isActive ? `<svg class="w-4 h-4 text-gold-dark shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>` : ''}
          </button>
        `;
      }).join('');

      list.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = parseInt(btn.dataset.i, 10);
          // Toggle: clicking the already-active variant resets to the base product.
          if (i === activeVariantIdx) {
            resetVariant();
            return;
          }
          activeVariantIdx = i;
          const v = variants[i];
          // If the variant has no own images, fall back to the main product gallery —
          // that way switching to a "color-only" variant doesn't keep showing the
          // previous variant's images by mistake.
          const baseImgs = (Array.isArray(p.imgs) && p.imgs.length) ? p.imgs : (p.img ? [p.img] : null);
          applyView({
            color: v.color,
            colorHex: v.colorHex,
            price: v.price || p.price,
            originalPrice: v.originalPrice || p.originalPrice,
            storage: v.storage || p.storage,
            imgs: (v.imgs && v.imgs.length) ? v.imgs : baseImgs,
          });
          renderVariants();
        });
      });
    }
    renderVariants();
  }

  if (p.cat === 'used') {
    document.getElementById('usedSpecs').classList.remove('hidden');
    document.getElementById('batteryV').textContent = p.battery || '—';
    document.getElementById('conditionV').textContent = p.condition || '—';
  }

  // Gallery
  const hero = document.getElementById('hero');
  const heroParent = hero ? hero.parentElement : null;
  const thumbsBox = document.getElementById('thumbs');
  const prevBtn = document.getElementById('prevImg');
  const nextBtn = document.getElementById('nextImg');
  let active = 0;

  // SVG placeholder injected when a product has no images yet — so the page never
  // looks broken to a visitor (and the admin can publish a draft without embarrassment).
  function showImagePlaceholder() {
    if (!heroParent) return;
    hero.style.display = 'none';
    let ph = heroParent.querySelector('.no-img-placeholder');
    if (!ph) {
      ph = document.createElement('div');
      ph.className = 'no-img-placeholder absolute inset-0 flex flex-col items-center justify-center text-black/30';
      ph.innerHTML = `
        <svg class="w-24 h-24 md:w-32 md:h-32 mb-3" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="9" r="1.5" fill="currentColor"/>
          <path d="M21 16l-5-5-9 9"/>
        </svg>
        <div class="text-[14px] font-bold">الصور قريباً</div>
        <div class="text-[12px] text-black/40 mt-1">كلّمنا على واتساب لشوف الجهاز</div>`;
      heroParent.appendChild(ph);
    }
    if (prevBtn) prevBtn.classList.add('hidden');
    if (nextBtn) nextBtn.classList.add('hidden');
    if (thumbsBox) thumbsBox.style.display = 'none';
  }
  function hideImagePlaceholder() {
    if (!heroParent) return;
    const ph = heroParent.querySelector('.no-img-placeholder');
    if (ph) ph.remove();
    hero.style.display = '';
    if (thumbsBox) thumbsBox.style.display = '';
  }

  function setActive(i) {
    if (!currentImgs.length) return;
    active = (i + currentImgs.length) % currentImgs.length;
    hero.style.opacity = '0';
    setTimeout(() => { hero.src = currentImgs[active]; hero.alt = p.name; hero.style.opacity = '1'; }, 120);
    thumbsBox.querySelectorAll('button').forEach((b, idx) => b.classList.toggle('active', idx === active));
  }

  function rebuildGallery() {
    if (!currentImgs.length) {
      thumbsBox.innerHTML = '';
      prevBtn.classList.add('hidden'); prevBtn.classList.remove('flex');
      nextBtn.classList.add('hidden'); nextBtn.classList.remove('flex');
      showImagePlaceholder();
      return;
    }
    hideImagePlaceholder();
    active = 0;
    hero.src = currentImgs[0];
    hero.alt = p.name;
    hero.style.opacity = '1';
    thumbsBox.innerHTML = currentImgs.map((src, i) => `
      <button class="thumb-btn aspect-square bg-white rounded-xl border border-black/10 overflow-hidden ${i===0?'active':''}" data-i="${i}">
        <img src="${src}" class="w-full h-full object-cover" alt=""/>
      </button>
    `).join('');
    thumbsBox.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => setActive(parseInt(btn.dataset.i, 10)));
    });
    if (currentImgs.length > 1) {
      prevBtn.classList.remove('hidden'); prevBtn.classList.add('flex');
      nextBtn.classList.remove('hidden'); nextBtn.classList.add('flex');
    } else {
      prevBtn.classList.add('hidden'); prevBtn.classList.remove('flex');
      nextBtn.classList.add('hidden'); nextBtn.classList.remove('flex');
    }
  }
  rebuildGallery();
  prevBtn.addEventListener('click', () => setActive(active - 1));
  nextBtn.addEventListener('click', () => setActive(active + 1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') setActive(active - 1);
    if (e.key === 'ArrowLeft') setActive(active + 1);
  });

  // Now apply the base product as the initial view (sets price/discount/storage/wa link).
  applyView(p);

  const related = window.ELKING_PRODUCTS.filter(x => x.cat === p.cat && x.id !== p.id).slice(0, 4);
  document.getElementById('related').innerHTML = related.map(window.renderProductCard).join('');
})();
</script>

</body>
